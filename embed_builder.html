<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DaanYT Embed Builder</title>
  <style>
    :root { color-scheme: dark; --bg: #151515; --panel: #202020; --line: #3a3a3a; --accent: #ff3737; --text: #f5f5f5; --muted: #a8a8a8; }
    * { box-sizing: border-box; } body { margin: 0; background: var(--bg); color: var(--text); font: 15px system-ui, sans-serif; }
    header { padding: 24px max(20px, calc((100% - 1180px) / 2)); border-bottom: 1px solid var(--line); }
    h1 { margin: 0 0 6px; font-size: 24px; } p { color: var(--muted); } main { max-width: 1180px; margin: auto; padding: 24px 20px 48px; display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(300px, .7fr); gap: 24px; }
    section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; } h2 { margin-top: 0; font-size: 18px; }
    label { display: block; margin: 14px 0 6px; color: #ddd; font-weight: 600; } input, textarea, select { width: 100%; border: 1px solid var(--line); border-radius: 7px; background: #111; color: var(--text); padding: 10px; font: inherit; } textarea { min-height: 120px; resize: vertical; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; } .field { border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-top: 10px; } .colour-control { display: flex; gap: 8px; } .colour-control input[type="color"] { width: 52px; min-width: 52px; height: 42px; padding: 3px; cursor: pointer; }
    button { border: 0; border-radius: 7px; padding: 10px 14px; font: inherit; font-weight: 700; cursor: pointer; background: var(--accent); color: white; } button.secondary { background: #3a3a3a; } .actions { display: flex; gap: 10px; margin-top: 18px; } #status { min-height: 22px; margin-top: 12px; }
    .preview-wrap { position: sticky; top: 20px; } .discord-message { background: #313338; padding: 18px; border-radius: 8px; } .embed { border-left: 4px solid #ff3737; background: #2b2d31; border-radius: 4px; padding: 12px 16px; min-height: 80px; white-space: pre-wrap; overflow-wrap: anywhere; } .embed h3 { margin: 0 0 8px; font-size: 17px; } .author, .footer { color: var(--muted); font-size: 12px; } .preview-field { margin-top: 12px; } .preview-field strong { display: block; } .hidden { display: none; }
    @media (max-width: 780px) { main { grid-template-columns: 1fr; } .preview-wrap { position: static; } .row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header><h1>DaanYT Embed Builder</h1><p>Deze pagina draait alleen lokaal op jouw pc. Mentions worden voor de veiligheid niet verstuurd.</p></header>
  <main>
    <section>
      <h2>Embed samenstellen</h2>
      <label for="channel">Tekstkanaal</label><select id="channel"><option>Laden…</option></select>
      <label for="content">Normaal bericht (optioneel)</label><input id="content" maxlength="2000" placeholder="Wordt boven de embed geplaatst">
      <label for="title">Titel</label><input id="title" maxlength="256" placeholder="Titel van de embed">
      <label for="description">Beschrijving</label><textarea id="description" maxlength="4096" placeholder="Beschrijving van de embed"></textarea>
      <div class="row"><div><label for="colour">Kleur</label><div class="colour-control"><input id="colour" value="#ff3737" maxlength="7"><input id="colour-picker" type="color" value="#ff3737" aria-label="Kleur kiezen"></div></div><div><label for="author">Auteur</label><input id="author" maxlength="256" placeholder="Optioneel"></div></div>
      <label for="footer">Footer</label><input id="footer" maxlength="2048" placeholder="Optioneel">
      <div class="row"><div><label for="thumbnail">Thumbnail-URL</label><input id="thumbnail" placeholder="https://…"></div><div><label for="image">Afbeelding-URL</label><input id="image" placeholder="https://…"></div></div>
      <h2 style="margin-top: 24px">Velden</h2><div id="fields"></div><div class="actions"><button type="button" class="secondary" id="add-field">Veld toevoegen</button></div>
      <div class="actions"><button type="button" id="send">Embed versturen</button></div><div id="status"></div>
    </section>
    <section class="preview-wrap"><h2>Live preview</h2><div class="discord-message"><div id="preview-content"></div><div class="embed" id="preview"><div class="author" id="preview-author"></div><h3 id="preview-title">Titel van de embed</h3><div id="preview-description">Beschrijving van de embed</div><div id="preview-fields"></div><div class="footer" id="preview-footer"></div></div></div></section>
  </main>
  <template id="field-template"><div class="field"><input class="field-name" maxlength="256" placeholder="Veldnaam"><textarea class="field-value" maxlength="1024" placeholder="Waarde"></textarea><label><input class="field-inline" type="checkbox" style="width:auto"> Naast elkaar plaatsen</label><button type="button" class="secondary remove-field">Verwijderen</button></div></template>
  <script>
    const ids = ['content','title','description','colour','author','footer','thumbnail','image'];
    const value = id => document.getElementById(id).value.trim();
    const fields = () => [...document.querySelectorAll('.field')].map(field => ({ name: field.querySelector('.field-name').value.trim(), value: field.querySelector('.field-value').value.trim(), inline: field.querySelector('.field-inline').checked }));
    function addField() { const node = document.getElementById('field-template').content.cloneNode(true); document.getElementById('fields').append(node); document.querySelector('#fields .field:last-child').querySelectorAll('input,textarea').forEach(el => el.addEventListener('input', preview)); document.querySelector('#fields .field:last-child .remove-field').addEventListener('click', e => { e.target.closest('.field').remove(); preview(); }); }
    function preview() { const colour = /^#[0-9a-fA-F]{6}$/.test(value('colour')) ? value('colour') : '#ff3737'; document.getElementById('preview').style.borderLeftColor = colour; document.getElementById('preview-content').textContent = value('content'); document.getElementById('preview-title').textContent = value('title') || 'Titel van de embed'; document.getElementById('preview-description').textContent = value('description') || 'Beschrijving van de embed'; document.getElementById('preview-author').textContent = value('author'); document.getElementById('preview-footer').textContent = value('footer'); document.getElementById('preview-fields').innerHTML = fields().filter(f => f.name && f.value).map(f => `<div class="preview-field"><strong>${escapeHtml(f.name)}</strong>${escapeHtml(f.value)}</div>`).join(''); }
    function escapeHtml(text) { const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }
    async function loadChannels() { const response = await fetch('/api/channels'); const data = await response.json(); const select = document.getElementById('channel'); if (!response.ok) throw new Error(data.error); select.innerHTML = data.channels.map(c => `<option value="${c.id}">#${escapeHtml(c.name)}</option>`).join(''); }
    document.getElementById('add-field').addEventListener('click', () => { if (document.querySelectorAll('.field').length < 25) addField(); });
    ids.forEach(id => document.getElementById(id).addEventListener('input', preview));
    document.getElementById('colour').addEventListener('input', event => { if (/^#[0-9a-fA-F]{6}$/.test(event.target.value)) document.getElementById('colour-picker').value = event.target.value; });
    document.getElementById('colour-picker').addEventListener('input', event => { document.getElementById('colour').value = event.target.value; preview(); });
    document.getElementById('send').addEventListener('click', async () => { const status = document.getElementById('status'); status.textContent = 'Versturen…'; try { const response = await fetch('/api/send', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ channel_id: document.getElementById('channel').value, content: value('content'), title: value('title'), description: value('description'), colour: value('colour'), author: value('author'), footer: value('footer'), thumbnail_url: value('thumbnail'), image_url: value('image'), fields: fields() }) }); const data = await response.json(); if (!response.ok) throw new Error(data.error); status.textContent = data.message; status.style.color = '#78e08f'; } catch (error) { status.textContent = error.message; status.style.color = '#ff6b6b'; } });
    loadChannels().catch(error => { document.getElementById('status').textContent = error.message; }); preview();
  </script>
</body>
</html>
